name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Contracts and Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make dev-install
      - run: make test

  dotnet:
    name: Build C# services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, project-api, aggregator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build services/${{ matrix.service }} -c Release -warnaserror

  dotnet-test:
    name: Aggregator tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cutsheet, POSTGRES_PASSWORD: cutsheet, POSTGRES_DB: cutsheet }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cutsheet" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: cutsheet
      CUTSHEET_TEST_PG: Host=localhost;Database=cutsheet;Username=cutsheet;Password=cutsheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: for f in db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U cutsheet -d cutsheet -f "$f"; done
      - run: dotnet test services/aggregator-tests

  client:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: client }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: docker-compose end to end
    runs-on: ubuntu-latest
    needs: [python, dotnet, dotnet-test]
    env:
      SP_MODE: rules   # в CI нет LLM: Script Parser размечает эвристиками
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make dev-install
      - run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      # У C#-сервисов нет healthcheck (в образе aspnet нет curl): ждём, пока Project API ответит через Kong.
      - run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8000/api/v1/health
      - run: make e2e
      - run: make e2e-dialogues
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
