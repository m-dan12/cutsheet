name: cutsheet

# Локальное окружение cutsheet (ТЗ, раздел 8). Запуск из корня: make up
# Внешние порты: Kong 8000 (API), Kafka 9094, PostgreSQL 5432, MinIO 9000 (S3) / 9001 (консоль).

x-python-env: &python-env
  KAFKA_BOOTSTRAP: kafka:9092
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cutsheet}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-cutsheet-secret}
  S3_BUCKET: ${S3_BUCKET:-cutsheet}
  LOG_LEVEL: INFO

x-dotnet-env: &dotnet-env
  ASPNETCORE_URLS: http://+:8080
  Kafka__BootstrapServers: kafka:9092
  ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-cutsheet};Username=${POSTGRES_USER:-cutsheet};Password=${POSTGRES_PASSWORD:-cutsheet}

services:
  # ---------- инфраструктура ----------
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # топики только как код: contracts/topics.txt
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9094:9094"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ../contracts/topics.txt:/topics.txt:ro
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh", "kafka:9092", "/topics.txt"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cutsheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutsheet}
      POSTGRES_DB: ${POSTGRES_DB:-cutsheet}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Миграции применяются при первом старте с пустым томом (этап 0).
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    # Официальные образы minio/minio больше не публикуются на Docker Hub;
    # pgsty/minio — сборка того же MinIO из исходников (AGPL), совместимая по API.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cutsheet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cutsheet-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # в образе есть mc
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cutsheet}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cutsheet-secret}
      S3_BUCKET: ${S3_BUCKET:-cutsheet}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing \"local/$$S3_BUCKET\""]
    restart: "no"

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["8000:8000", "127.0.0.1:8001:8001"]
    volumes: [./kong/kong.yml:/kong/kong.yml:ro]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- сервисы ----------
  scene-detection:
    build: { context: .., dockerfile: services/scene-detection/Dockerfile }
    image: cutsheet/scene-detection:dev
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: scene-detection
      SD_DETECTOR: ${SD_DETECTOR:-content}
      SD_THRESHOLD: ${SD_THRESHOLD:-27.0}
      SD_MIN_SCENE_MS: ${SD_MIN_SCENE_MS:-1000}
      SD_KEYFRAMES: ${SD_KEYFRAMES:-3}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  auth:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    image: cutsheet/auth:dev
    environment: *dotnet-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  project-api:
    build: { context: .., dockerfile: services/project-api/Dockerfile }
    image: cutsheet/project-api:dev
    environment: *dotnet-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  aggregator:
    build: { context: .., dockerfile: services/aggregator/Dockerfile }
    image: cutsheet/aggregator:dev
    environment: *dotnet-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  minio-data:
