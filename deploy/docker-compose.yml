name: cutsheet

# Локальное окружение cutsheet (ТЗ, раздел 8). Запуск из корня: make up
# Внешние порты: Kong 8000 (API), Kafka 9094, PostgreSQL 5432, MinIO 9000 (S3) / 9001 (консоль).
# Клиент ходит в Kong (API, SignalR) и напрямую в MinIO по presigned URL (S3_PUBLIC_ENDPOINT).
# Наблюдаемость (этап 6): make up-obs — ещё Prometheus :9090, Grafana :3000, Jaeger :16686.

# Повторы и DLQ (ТЗ 4.3) и трейсинг: трейсы уходят в Jaeger, только если задан
# OTEL_EXPORTER_OTLP_ENDPOINT (make up-obs задаёт http://jaeger:4318).
x-ops-env: &ops-env
  KAFKA_MAX_ATTEMPTS: ${KAFKA_MAX_ATTEMPTS:-3}
  KAFKA_RETRY_BACKOFF_S: ${KAFKA_RETRY_BACKOFF_S:-2}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

x-python-env: &python-env
  KAFKA_BOOTSTRAP: kafka:9092
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cutsheet}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-cutsheet-secret}
  S3_BUCKET: ${S3_BUCKET:-cutsheet}
  LOG_LEVEL: INFO
  METRICS_PORT: 9100   # /metrics и /health (cutsheet_common.observability)
  <<: *ops-env

# Общий слой LLM (ТЗ 5.10): по умолчанию Ollama на хосте (Docker Desktop / WSL).
# Внутри compose: docker compose --profile llm up, LLM_BASE_URL=http://ollama:11434/v1.
x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
  LLM_API_KEY: ${LLM_API_KEY:-ollama}
  LLM_STRUCTURED: ${LLM_STRUCTURED:-json_schema}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}

x-dotnet-env: &dotnet-env
  ASPNETCORE_URLS: http://+:8080
  Kafka__BootstrapServers: kafka:9092
  ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-cutsheet};Username=${POSTGRES_USER:-cutsheet};Password=${POSTGRES_PASSWORD:-cutsheet}
  Kafka__MaxAttempts: ${KAFKA_MAX_ATTEMPTS:-3}
  Kafka__RetryBackoffSeconds: ${KAFKA_RETRY_BACKOFF_S:-2}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

# Python-сервис здоров, пока жив цикл чтения Kafka (долгий этап — не зависание).
x-python-health: &python-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 120s

services:
  # ---------- инфраструктура ----------
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # топики только как код: contracts/topics.txt
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9094:9094"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ../contracts/topics.txt:/topics.txt:ro
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh", "kafka:9092", "/topics.txt"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cutsheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutsheet}
      POSTGRES_DB: ${POSTGRES_DB:-cutsheet}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Миграции применяются при первом старте с пустым томом (этап 0).
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    # Официальные образы minio/minio больше не публикуются на Docker Hub;
    # pgsty/minio — сборка того же MinIO из исходников (AGPL), совместимая по API.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cutsheet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cutsheet-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # в образе есть mc
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cutsheet}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cutsheet-secret}
      S3_BUCKET: ${S3_BUCKET:-cutsheet}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing \"local/$$S3_BUCKET\""]
    restart: "no"

  kong:
    image: kong:3.9
    # start.sh ждёт публичный ключ Auth Service и подставляет его в consumer плагина jwt.
    entrypoint: ["/bin/sh", "/kong/start.sh"]
    depends_on:
      auth: { condition: service_started }
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["8000:8000", "127.0.0.1:8001:8001"]
    volumes:
      - ./kong:/kong:ro
      - auth-keys:/keys:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- сервисы ----------
  scene-detection:
    build: { context: .., dockerfile: services/scene-detection/Dockerfile }
    image: cutsheet/scene-detection:dev
    healthcheck: *python-health
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: scene-detection
      SD_DETECTOR: ${SD_DETECTOR:-content}
      SD_THRESHOLD: ${SD_THRESHOLD:-27.0}
      SD_MIN_SCENE_MS: ${SD_MIN_SCENE_MS:-1000}
      SD_KEYFRAMES: ${SD_KEYFRAMES:-3}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  script-parser:
    build: { context: .., dockerfile: services/script-parser/Dockerfile }
    image: cutsheet/script-parser:dev
    healthcheck: *python-health
    environment:
      <<: [*python-env, *llm-env]
      KAFKA_GROUP_ID: script-parser
      SP_MODE: ${SP_MODE:-llm}            # rules — эвристики без LLM
      SP_CHUNK_CHARS: ${SP_CHUNK_CHARS:-6000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  transcription:
    build:
      context: ..
      dockerfile: services/transcription/Dockerfile
      args: { TA_EXTRAS: "${TA_EXTRAS:-whisper}" }   # whisperx — GPU-образ
    image: cutsheet/transcription:dev
    healthcheck: *python-health
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: transcription
      TA_BACKEND: ${TA_BACKEND:-faster-whisper}
      TA_MODEL: ${TA_MODEL:-small}
      TA_DEVICE: ${TA_DEVICE:-auto}
      TA_COMPUTE_TYPE: ${TA_COMPUTE_TYPE:-default}
      TA_LANGUAGE: ${TA_LANGUAGE-ru}
    volumes: [whisper-models:/models]   # модели Whisper скачиваются при первом запуске
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  export:
    build: { context: .., dockerfile: services/export/Dockerfile }
    image: cutsheet/export:dev
    healthcheck: *python-health
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: export
    # Свои шаблоны оформления (FR-E7): <имя>.json, без пересборки образа.
    volumes: [./export-templates:/templates:ro]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  shot-type:
    build: { context: .., dockerfile: services/shot-type/Dockerfile }
    image: cutsheet/shot-type:dev
    healthcheck: *python-health
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: shot-type
      ST_MAX_FRAMES: ${ST_MAX_FRAMES:-5}
      ST_MODEL_BASE_URL: ${ST_MODEL_BASE_URL:-https://storage.googleapis.com/mediapipe-models}
    volumes: [mediapipe-models:/models]   # модели MediaPipe скачиваются при первой сцене
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Своя модель: Script Parser нужна текстовая, Scene Description — мультимодальная (FR-LLM2).
  scene-description:
    build: { context: .., dockerfile: services/scene-description/Dockerfile }
    image: cutsheet/scene-description:dev
    healthcheck: *python-health
    environment:
      <<: *python-env
      KAFKA_GROUP_ID: scene-description
      SDS_MODE: ${SDS_MODE:-llm}            # stub — без LLM, описание-заглушка
      SDS_MAX_FRAMES: ${SDS_MAX_FRAMES:-3}
      LLM_BASE_URL: ${SDS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${SDS_LLM_MODEL:-qwen2.5vl:7b}
      LLM_API_KEY: ${SDS_LLM_API_KEY:-ollama}
      LLM_STRUCTURED: ${SDS_LLM_STRUCTURED:-json_schema}
      LLM_TIMEOUT_S: ${SDS_LLM_TIMEOUT_S:-600}
      LLM_MAX_CONCURRENCY: ${SDS_LLM_MAX_CONCURRENCY:-1}
      LLM_RATE_LIMIT_RPM: ${SDS_LLM_RATE_LIMIT_RPM:-0}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Локальная LLM для Script Parser и Scene Description: docker compose --profile llm up
  # После старта: docker compose exec ollama ollama pull qwen2.5:7b-instruct
  #               docker compose exec ollama ollama pull qwen2.5vl:7b
  # и SDS_LLM_BASE_URL=http://ollama:11434/v1 (как LLM_BASE_URL)
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [llm]
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    restart: unless-stopped

  auth:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    image: cutsheet/auth:dev
    environment:
      <<: *dotnet-env
      Kafka__ClientId: auth
      Auth__KeyDir: /keys
      Auth__AccessMinutes: ${AUTH_ACCESS_MINUTES:-15}
    volumes: [auth-keys:/keys]    # закрытый ключ подписи JWT; публичный читают Kong и Project API
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  project-api:
    build: { context: .., dockerfile: services/project-api/Dockerfile }
    image: cutsheet/project-api:dev
    environment:
      <<: *dotnet-env
      Kafka__ClientId: project-api
      Auth__PublicKeyPath: /keys/jwt-public.pem
      S3__Endpoint: http://minio:9000
      S3__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3__AccessKey: ${S3_ACCESS_KEY:-cutsheet}
      S3__SecretKey: ${S3_SECRET_KEY:-cutsheet-secret}
      S3__Bucket: ${S3_BUCKET:-cutsheet}
    volumes: [auth-keys:/keys:ro]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  aggregator:
    build: { context: .., dockerfile: services/aggregator/Dockerfile }
    image: cutsheet/aggregator:dev
    environment:
      <<: *dotnet-env
      Kafka__ClientId: aggregator
      # Сколько ждать обогащения без единого ответа по проекту, прежде чем сцены станут enrichment_failed (FR-A6).
      Enrichment__TimeoutMinutes: ${ENRICHMENT_TIMEOUT_MINUTES:-30}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ---------- наблюдаемость (этап 6): make up-obs ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # локально дашборд открывается без входа
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cutsheet.json
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

  # Трейсы OpenTelemetry (OTLP HTTP :4318) и их просмотр (UI :16686); хранит в памяти.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports: ["16686:16686", "4318:4318"]
    restart: unless-stopped

  # Lag консьюмеров и размер топиков (в т.ч. DLQ) для Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [observability]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  prometheus-data:
  auth-keys:
  kafka-data:
  pg-data:
  minio-data:
  whisper-models:
  mediapipe-models:
  ollama-models:
