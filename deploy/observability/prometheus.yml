# Prometheus (этап 6): опрашивает /metrics сервисов и kafka-exporter (lag консьюмеров).
# Запуск: make up-obs → http://localhost:9090 (Prometheus), :3000 (Grafana), :16686 (Jaeger).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  # Python-сервисы: HTTP-сервер адаптера Kafka (cutsheet_common.observability) на :9100.
  - job_name: cutsheet-python
    static_configs:
      - targets:
          - scene-detection:9100
          - script-parser:9100
          - transcription:9100
          - shot-type:9100
          - scene-description:9100
          - export:9100
    relabel_configs:
      - { source_labels: [__address__], regex: "([^:]+):.*", target_label: instance }

  # C#-сервисы: prometheus-net на /metrics основного порта.
  - job_name: cutsheet-dotnet
    static_configs:
      - targets: [auth:8080, project-api:8080, aggregator:8080]
    relabel_configs:
      - { source_labels: [__address__], regex: "([^:]+):.*", target_label: instance }

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
