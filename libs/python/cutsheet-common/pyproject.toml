[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cutsheet-common"
version = "0.1.0"
description = "Общий код Python-сервисов cutsheet: конверт событий, проверка контрактов, адаптер Kafka, S3"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "boto3>=1.35,<2",
  "jsonschema>=4.23,<5",
  "referencing>=0.35",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
