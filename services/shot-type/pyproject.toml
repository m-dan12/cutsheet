[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shot-type"
version = "0.1.0"
description = "Shot Type: крупность плана по ключевым кадрам (MediaPipe)"
requires-python = ">=3.11"
# mediapipe ставится отдельно с --no-deps: он тянет opencv-contrib-python с GUI, который
# конфликтует с opencv-python-headless (Scene Detection), и sounddevice. Ниже — то, что
# mediapipe реально импортирует (см. Dockerfile и README).
dependencies = [
  "cutsheet-common",
  "numpy",
  "pillow>=10",
  "absl-py",
  "flatbuffers",
  "certifi",
  "matplotlib",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shot-type = "shot_type.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
