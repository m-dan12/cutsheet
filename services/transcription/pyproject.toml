[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription"
version = "0.1.0"
description = "Transcription & Alignment: распознавание речи (faster-whisper / WhisperX) и сопоставление со сценарием"
requires-python = ">=3.11"
dependencies = [
  "cutsheet-common",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
# CPU-образ: faster-whisper (CTranslate2, без torch). GPU и пословное выравнивание wav2vec2 — whisperx.
whisper = ["faster-whisper>=1.1,<2"]
whisperx = ["whisperx>=3.3"]
test = ["pytest>=8"]

[project.scripts]
transcription = "transcription.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
